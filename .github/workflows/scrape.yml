name: Daily Scrape

# Trigger: scheduled cron + manual dispatch from GitHub Actions UI or
# from the Streamlit dashboard sidebar (workflow_dispatch API).

on:
  schedule:
    # 07:00 UTC every day (~ 08:00 Paris winter / 09:00 summer)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scraper.py

      - name: Commit updated missions.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missions.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update missions.csv [skip ci]"
            git push
          fi
